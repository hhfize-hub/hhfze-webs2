<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MY DAILY — Your life, organized in one place.</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            void: '#050508',
            charcoal: '#0d0f14',
            slateDark: '#161922',
            slateCard: '#12151e',
            softWhite: '#f4f5f7',
            mutedGray: '#8a94a6',
            electric: '#3b82f6',
            royalPurple: '#8b5cf6',
            neonViolet: '#a855f7',
          },
          boxShadow: {
            'glow-blue': '0 0 24px -4px rgba(59, 130, 246, 0.35)',
            'glow-purple': '0 0 24px -4px rgba(139, 92, 246, 0.35)',
            'card': '0 10px 30px -10px rgba(0, 0, 0, 0.6)',
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- QR generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <!-- Leaflet CSS & JS for GPS Activity -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root {
      --primary: #3b82f6;
      --accent: #8b5cf6;
      --tertiary: #a855f7;
      --surface-tint: #0d0f14;
      --text-on-primary: #ffffff;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent-glow: rgba(139, 92, 246, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #050508;
      color: #f4f5f7;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      height: 100%;
    }

    html.light body {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(13, 15, 20, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(138, 148, 166, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Glassmorphism & Card Utilities */
    .glass-panel {
      background: color-mix(in srgb, var(--surface-tint) 82%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    html.light .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .os-card {
      background: linear-gradient(145deg, color-mix(in srgb, var(--surface-tint) 88%, #1e2230), var(--surface-tint));
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 1rem;
      box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.65);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .os-card:hover {
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
    }
    html.light .os-card {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 8px 24px -10px rgba(15, 23, 42, 0.08);
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 55%, var(--tertiary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: var(--text-on-primary);
      transition: all 0.2s ease;
    }
    .gradient-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 20px -4px var(--accent-glow);
      transform: translateY(-1px);
    }
    .gradient-btn:active {
      transform: translateY(0);
    }

    .theme-primary-text { color: var(--primary); }
    .theme-accent-text { color: var(--accent); }
    .theme-primary-bg { background-color: var(--primary); color: var(--text-on-primary); }
    .theme-accent-bg { background-color: var(--accent); color: var(--text-on-primary); }
    .theme-active-nav {
      background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 22%, transparent), color-mix(in srgb, var(--accent) 22%, transparent));
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      box-shadow: 0 0 20px -6px var(--accent-glow);
    }

    /* Ambient Background Mesh */
    .bg-mesh {
      background-image:
        radial-gradient(at 12% 15%, color-mix(in srgb, var(--primary) 13%, transparent) 0px, transparent 45%),
        radial-gradient(at 88% 10%, color-mix(in srgb, var(--accent) 14%, transparent) 0px, transparent 45%),
        radial-gradient(at 50% 90%, color-mix(in srgb, var(--tertiary) 9%, transparent) 0px, transparent 50%);
    }

    /* Animations */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: fadeSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Leaflet Dark Tile Filter */
    html.dark .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(92%);
    }
    .leaflet-container {
      z-index: 10 !important;
      border-radius: 0.875rem;
    }

    /* Range Input */
    input[type="range"] {
      -webkit-appearance: none;
      background: rgba(138, 148, 166, 0.22);
      height: 5px;
      border-radius: 999px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Touch Targets for Mobile */
    @media (max-width: 768px) {
      button, select, input[type="date"], input[type="time"] {
        min-height: 38px;
      }
    }

    /* Hide scrollbar for horizontal pills */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-void text-softWhite bg-mesh antialiased selection:bg-royalPurple/30 selection:text-white">

  <!-- Toast Container -->

  <!-- Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-[90] bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4">
    <div id="modal-box" class="os-card w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 sm:p-6 relative animate-view">

        <div>

  <!-- Main App Shell -->

    <!-- Desktop Collapsible Sidebar -->

        <div class="flex items-center gap-3 overflow-hidden">

      </div>
    </aside>

    <!-- Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">

      <!-- Top Header -->
      <header class="h-16 glass-panel border-b border-white/10 px-4 lg:px-6 flex items-center justify-between gap-3 shrink-0 z-20">
        <!-- Left: Mobile Menu + Greeting & Clock -->
        <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
          <button onclick="App.toggleMobileDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 hover:bg-white/10 text-softWhite shrink-0">

            <input

          </div>
        </div>

        <!-- Right: Language Quick Switch + Sync Status + Quick Add + Notifications + Auth/Profile -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Language Quick Pill -->
          <button onclick="App.toggleLanguageQuick()" id="header-lang-btn" class="px-2 py-1.5 rounded-xl bg-white/[0.04] hover:bg-white/10 border border-white/10 text-[11px] font-bold text-mutedGray hover:text-white transition" title="Switch Language (EN / ID)">
            EN

          <!-- Sync Status Badge -->
          <div id="sync-status-badge" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-[11px] font-medium bg-white/[0.04] border border-white/10 cursor-pointer" onclick="App.navigate('profile')" title="Storage & Sync Status">

            <span id="sync-label" class="hidden sm:inline">Local Mode</span>

    // =========================================================================
    // MODULE 3: INDEXEDDB LOCAL STORAGE SERVICE (services/storage.js)
    // =========================================================================
    const LocalDB = {
      dbName: 'MyDailyEcosystemDB',
      version: 3,
      db: null,

      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('state')) {
              db.createObjectStore('state', { keyPath: 'key' });
            }
            if (!db.objectStoreNames.contains('audioBlobs')) {
              db.createObjectStore('audioBlobs', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('offlineMusicStore')) {
              db.createObjectStore('offlineMusicStore', { keyPath: 'id' });
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = () => reject(req.error);
        });
      },

      async getState(key) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('state', 'readonly');
            const req = tx.objectStore('state').get(key);
            req.onsuccess = () => resolve(req.result ? req.result.value : null);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      },

      async setState(key, value) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('state', 'readwrite');
            tx.objectStore('state').put({ key, value, updatedAt: Date.now() });
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch {
            resolve(false);
          }
        });
      },

      async saveAudioBlob(id, blob, meta) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction('audioBlobs', 'readwrite');
          tx.objectStore('audioBlobs').put({ id, blob, meta });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      },

      async getAudioBlob(id) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction('audioBlobs', 'readonly');
          const req = tx.objectStore('audioBlobs').get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      },

      async saveOfflineSong(songObj, blob) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction('offlineMusicStore', 'readwrite');
          tx.objectStore('offlineMusicStore').put({
            id: songObj.id,
            meta: songObj,
            blob,
            sizeBytes: blob.size || 0,
            savedAt: Date.now()
          });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      },

      async getAllOfflineSongs() {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('offlineMusicStore', 'readonly');
            const req = tx.objectStore('offlineMusicStore').getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          } catch {
            resolve([]);
          }
        });
      },

      async deleteOfflineSong(id) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction('offlineMusicStore', 'readwrite');
          tx.objectStore('offlineMusicStore').delete(id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      }
    };

            const localData = Store.data[key];

            if (!snap.exists()) {
              await setDoc(ref, { items: localData, updatedAt: Date.now(), uid: this.user.uid });

                if (docSnap.exists() && !docSnap.metadata.hasPendingWrites) {
                  const remoteItems = docSnap.data().items;
                  if (JSON.stringify(remoteItems) !== JSON.stringify(Store.data[key])) {

      mergeCollections(local, cloud) {
        if (Array.isArray(local) && Array.isArray(cloud)) {
          const map = new Map();
          cloud.forEach((item) => { if (item && item.id) map.set(item.id, item); });
          local.forEach((item) => {
            if (item && item.id) {
              if (!map.has(item.id) || (item.updatedAt || 0) > (map.get(item.id).updatedAt || 0)) {
                map.set(item.id, item);
              }
            }
          });
          return Array.from(map.values());
        }
        if (typeof local === 'object' && local !== null && typeof cloud === 'object' && cloud !== null) {
          return { ...local, ...cloud };
        }
        return cloud !== undefined ? cloud : local;
      },

      computeProductivityScore() {
        const today = this.todayStr();
        const tasks = this.data.tasks || [];
        const todayTasks = tasks.filter((t) => !t.dueDate || t.dueDate === today);
        const taskRatio = todayTasks.length
          ? todayTasks.filter((t) => t.completed).length / todayTasks.length
          : (tasks.length ? tasks.filter((t) => t.completed).length / tasks.length : 0);

        const habits = this.data.habits || [];
        const doneHabits = (this.data.habitLogs[today] || []).length;
        const habitRatio = habits.length ? Math.min(1, doneHabits / habits.length) : 0;

        const todaySessions = (this.data.focusSessions || []).filter((s) => s.date === today);
        const focusMinutes = todaySessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
        const focusRatio = Math.min(1, focusMinutes / 100);

        const goals = this.data.goals || [];
        let goalRatio = 0;
        if (goals.length) {
          const sum = goals.reduce((acc, g) => {
            const ms = g.milestones || [];
            if (!ms.length) return acc;
            return acc + ms.filter((m) => m.done).length / ms.length;
          }, 0);
          goalRatio = sum / goals.length;
        }

        const score = Math.round((taskRatio * 35) + (habitRatio * 30) + (focusRatio * 20) + (goalRatio * 15));
        return {
          score: Math.min(100, Math.max(0, score)),
          taskPct: Math.round(taskRatio * 100),
          habitPct: Math.round(habitRatio * 100),
          focusMinutes,
          goalPct: Math.round(goalRatio * 100)
        };
      },

      calculateHabitStreak(habitId) {
        let streak = 0;
        const d = new Date();
        for (let i = 0; i < 365; i++) {
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const logs = this.data.habitLogs[key] || [];
          if (logs.includes(habitId)) {
            streak++;
          } else if (i > 0) {
            break;
          }
          d.setDate(d.getDate() - 1);
        }
        return streak;
      }

        if (track.source === 'youtube' && track.videoId) {

            if (!navigator.onLine) { App.toast('YouTube playback memerlukan internet.', 'error'); return; }
            await YouTubePlayerAPI.load();
            const mount = document.getElementById('youtube-player-mount');
            if (!mount) { App.toast('Player YouTube belum tersedia. Buka halaman Music lagi.', 'error'); return; }
            mount.classList.remove('hidden');
            document.getElementById('youtube-player-shell')?.classList.remove('hidden');
            document.getElementById('music-artwork')?.classList.add('hidden');
            if (!YouTubePlayerAPI.player) {
              YouTubePlayerAPI.player = new YT.Player('youtube-player-mount', {
                width: '100%', height: '100%', videoId: track.videoId,
                playerVars: { autoplay: 1, controls: 1, playsinline: 1, rel: 0 },
                events: {
                  onReady: (event) => { event.target.playVideo(); this.isPlaying = true; this.updateUI(); },
                  onStateChange: (event) => {
                    if (event.data === YT.PlayerState.PLAYING) { this.isPlaying = true; clearInterval(this.interval); this.interval = setInterval(() => { try { this.progressSec = Math.floor(YouTubePlayerAPI.player.getCurrentTime() || 0); this.updateProgressUI(); } catch {} }, 500); }
                    if (event.data === YT.PlayerState.PAUSED) { this.isPlaying = false; clearInterval(this.interval); this.updateUI(); }
                    if (event.data === YT.PlayerState.ENDED) { this.isPlaying = false; clearInterval(this.interval); this.next(); }
                  },
                  onError: () => { this.isPlaying = false; App.toast('Video tidak dapat diputar di player YouTube.', 'error'); this.updateUI(); }
                }
              });
            } else {
              YouTubePlayerAPI.player.loadVideoById(track.videoId);
              this.isPlaying = true;
            }
          } catch (err) { App.toast('Gagal memulai YouTube Player: ' + err.message, 'error'); return; }
        } else if (track.isBuiltin) {
          const shell = document.getElementById('youtube-player-shell'); if (shell) shell.classList.add('hidden');
          document.getElementById('music-artwork')?.classList.remove('hidden');
          const mount = document.getElementById('youtube-player-mount'); if (mount) mount.classList.add('hidden');
          this.startSynth(track.synthFreq || 144); this.isPlaying = true;
          this.interval = setInterval(() => { if (!this.isPlaying) return; this.progressSec++; if (this.progressSec >= track.duration) { this.progressSec = 0; this.next(); } this.updateProgressUI(); }, 1000);
        } else {
          const shell = document.getElementById('youtube-player-shell'); if (shell) shell.classList.add('hidden');
          document.getElementById('music-artwork')?.classList.remove('hidden');
          const mount = document.getElementById('youtube-player-mount'); if (mount) mount.classList.add('hidden');
          const offlineAll = await LocalDB.getAllOfflineSongs();
          const offlineHit = offlineAll.find(o => o.id === track.id);
          if (offlineHit && offlineHit.blob) { this.audioEl.src = URL.createObjectURL(offlineHit.blob); await this.audioEl.play(); this.isPlaying = true; }
          else {
            const blobRecord = await LocalDB.getAudioBlob(track.id);
            if (blobRecord && blobRecord.blob) { this.audioEl.src = URL.createObjectURL(blobRecord.blob); await this.audioEl.play(); this.isPlaying = true; }
            else if (track.previewUrl || track.cloudUrl) { if (!navigator.onLine) { App.toast('Offline: unduh audio yang legal saat online untuk diputar offline.', 'error'); return; } this.audioEl.src = track.previewUrl || track.cloudUrl; await this.audioEl.play(); this.isPlaying = true; }
            else { App.toast('Audio source unavailable offline.', 'error'); return; }
          }
          this.interval = setInterval(() => { this.progressSec = Math.floor(this.audioEl.currentTime || 0); this.updateProgressUI(); }, 500);
        }
        const rec = Store.data.musicMeta?.recentlyPlayed || [];
        Store.data.musicMeta.recentlyPlayed = [track.id, ...rec.filter(id => id !== track.id)].slice(0, 12);
        Store.save('musicMeta'); this.updateUI();
        if (App.currentView === 'music' && track.source !== 'youtube') App.renderCurrentView();
      },

      togglePlay() {
        const track = this.getCurrentTrack();
        if (track?.source === 'youtube' && YouTubePlayerAPI.player) {
          const state = YouTubePlayerAPI.player.getPlayerState();
          if (state === YT.PlayerState.PLAYING) YouTubePlayerAPI.player.pauseVideo(); else YouTubePlayerAPI.player.playVideo();
          this.isPlaying = state !== YT.PlayerState.PLAYING; this.updateUI();
          if (App.currentView === 'music') App.renderCurrentView(); return;
        }
        if (this.isPlaying) { this.isPlaying = false; this.stopSynth(); this.audioEl.pause(); clearInterval(this.interval); this.updateUI(); if (App.currentView === 'music') App.renderCurrentView(); }
        else this.playTrack(this.currentIndex);
      },

      next() {
        if (Store.data.musicMeta?.shuffle) {
          this.currentIndex = Math.floor(Math.random() * this.tracks.length);
        } else {
          this.currentIndex = (this.currentIndex + 1) % this.tracks.length;
        }
        this.progressSec = 0;
        this.playTrack(this.currentIndex);
      },

      prev() {
        this.currentIndex = (this.currentIndex - 1 + this.tracks.length) % this.tracks.length;
        this.progressSec = 0;
        this.playTrack(this.currentIndex);
      },

      seek(pct) {
        const track = this.getCurrentTrack();
        if (!track) return;
        const dur = track.isBuiltin ? track.duration : (track.source === 'youtube' ? (YouTubePlayerAPI.player?.getDuration?.() || track.duration || 0) : (this.audioEl.duration || track.duration || 0));
        const target = Math.floor((pct / 100) * dur);
        this.progressSec = target;
        if (track.source === 'youtube' && YouTubePlayerAPI.player) YouTubePlayerAPI.player.seekTo(target, true);
        else if (!track.isBuiltin && this.audioEl.src) this.audioEl.currentTime = target;
        this.updateProgressUI();
      },

      setVolume(val) {
        const vol = Math.max(0, Math.min(1, parseFloat(val)));
        Store.data.musicMeta.volume = vol;
        this.audioEl.volume = vol;
        if (this.gainNode && this.audioCtx) {
          this.gainNode.gain.setValueAtTime(vol * 0.08, this.audioCtx.currentTime);
        }
        Store.save('musicMeta');
      },

      // Internet Archive public audio catalog
      async searchInternetArchive(query){
        this.archiveQuery=(query||'').trim();
        if(!this.archiveQuery)return;
        this.archiveSearchResults=[];
        App.renderCurrentView();
        try{
          const q=encodeURIComponent(`(${this.archiveQuery}) AND mediatype:audio AND licenseurl:http*creativecommons.org*`);
          const url=`https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=licenseurl&fl[]=rights&rows=12&page=1&output=json`;
          const res=await fetch(url);
          if(!res.ok)throw new Error('Catalog unavailable');
          const data=await res.json();
          const items=data.response?.docs||[];
          const resolved=await Promise.all(items.slice(0,8).map(async item=>{
            try{
              const m=await fetch(`https://archive.org/metadata/${encodeURIComponent(item.identifier)}`).then(x=>x.json());
              const files=(m.files||[]).filter(f=>/^(mp3|ogg|flac|wav)$/i.test(f.format||'')&&!f.name.includes('_meta')&&!f.name.endsWith('.xml')).sort((a,b)=>{const ap=/mp3/i.test(a.format)?0:1,bp=/mp3/i.test(b.format)?0:1;return ap-bp;});
              const file=files[0];
              if(!file)return null;
              const lic=item.licenseurl||m.metadata?.licenseurl||m.metadata?.rights||item.rights||'Rights not specified';
              return {identifier:item.identifier,title:item.title||m.metadata?.title||item.identifier,creator:item.creator||m.metadata?.creator||'Unknown creator',license:String(lic).slice(0,140),page:`https://archive.org/details/${item.identifier}`,url:`https://archive.org/download/${item.identifier}/${encodeURIComponent(file.name).replace(/%2F/g,'/')}`,duration:Number(file.duration||0)}
            }catch{return null;}
          }));
          this.archiveSearchResults=resolved.filter(Boolean);
        }catch(e){
          App.toast('Internet Archive search failed.','error');
        }
        App.renderCurrentView();
      },

      async playArchiveItem(index){
        const r=this.archiveSearchResults[index];
        if(!r)return;
        const track={id:'ia_'+r.identifier,title:r.title,artist:r.creator,album:'Internet Archive',category:'Open catalog',duration:r.duration||0,previewUrl:r.url,artworkUrl:'',coverGradient:'from-blue-600 to-purple-700',isBuiltin:false,cloudUrl:r.url,license:r.license,sourcePage:r.page};
        await this.playExternalOrOfflineTrack(track);
        this.tracks[this.currentIndex].sourcePage=r.page;
      },

      // YouTube Music Search & Stream Integration (Full Duration)
      async searchGlobalMusic(query) {
        this.searchQuery = (query || '').trim(); if (!this.searchQuery) return;
        if (!navigator.onLine) { App.toast('Anda sedang offline.', 'error'); return; }
        if (!MY_DAILY_YOUTUBE_API_KEY || MY_DAILY_YOUTUBE_API_KEY === 'YOUR_YOUTUBE_API_KEY') { App.toast('Isi MY_DAILY_YOUTUBE_API_KEY di file HTML dengan API key YouTube Data API v3 agar pencarian aktif.', 'error'); return; }
        this.isSearching = true; App.renderCurrentView();
        try {
          const params = new URLSearchParams({ part:'snippet', type:'video', videoCategoryId:'10', maxResults:'12', q:this.searchQuery, key:MY_DAILY_YOUTUBE_API_KEY });
          const res = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
          if (!res.ok) { const info=await res.json().catch(()=>({})); throw new Error(info.error?.message || 'YouTube API error'); }
          const data = await res.json();
          this.searchResults = (data.items || []).filter(i=>i.id?.videoId).map(i=>({
            id:'yt_'+i.id.videoId, videoId:i.id.videoId, source:'youtube', title:i.snippet.title,
            artist:i.snippet.channelTitle||'YouTube', album:'YouTube', category:'Global', duration:0,
            previewUrl:'', cloudUrl:`https://www.youtube.com/watch?v=${i.id.videoId}`,
            artworkUrl:i.snippet.thumbnails?.high?.url||i.snippet.thumbnails?.medium?.url||i.snippet.thumbnails?.default?.url||'',
            coverGradient:'from-red-600 to-rose-700', isBuiltin:false
          }));
        } catch(err) { console.error('YouTube API search error',err); App.toast('Pencarian YouTube gagal: '+err.message,'error'); this.searchResults=[]; }
        finally { this.isSearching=false; App.renderCurrentView(); }
      },

      // Genuine Offline Audio Blob Download (Full Duration)
      async downloadForOffline(trackId) {
        const song = this.searchResults.find((s) => s.id === trackId);
        if (!song || song.source === 'youtube' || !song.previewUrl || this.downloadingIds.has(trackId)) { if (song?.source === 'youtube') App.toast('Unduhan YouTube tidak tersedia. Gunakan sumber audio yang memiliki izin unduh.', 'info'); return; }

        this.downloadingIds.add(trackId);
        App.renderCurrentView();

        try {
          const response = await fetch(song.previewUrl);
          if (!response.ok) throw new Error('Download stream failed');
          const blob = await response.blob();
          const savedMeta = {
            ...song,
            duration: song.duration,
            isOfflineSaved: true
          };
          await LocalDB.saveOfflineSong(savedMeta, blob);
          this.offlineTracks = [savedMeta, ...this.offlineTracks.filter((o) => o.id !== song.id)];
          if (!this.tracks.some((t) => t.id === song.id)) {
            this.tracks.push(savedMeta);
          }
          App.toast(`Berhasil mengunduh "${song.title}" full durasi untuk offline!`, 'success');
        } catch (err) {
          App.toast('Gagal mengunduh audio: ' + err.message, 'error');
        } finally {
          this.downloadingIds.delete(trackId);
          App.renderCurrentView();
        }
      },

      async removeOfflineSong(trackId) {
        await LocalDB.deleteOfflineSong(trackId);
        this.offlineTracks = this.offlineTracks.filter((o) => o.id !== trackId);
        this.tracks = this.tracks.filter((t) => t.id !== trackId);
        App.toast('Removed from offline storage.', 'info');
        App.renderCurrentView();
      },

      async uploadAudioFiles(fileList) {
        const customTracks = (await LocalDB.getState('customAudioTracks')) || [];
        for (const file of fileList) {
          if (!file.type.startsWith('audio/')) continue;
          const id = 'audio_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
          let cloudUrl = '';
          if (CloudSync.isGoogleUser && CloudSync.storage && CloudSync.user) {
            try {
              const sRef = storageRef(CloudSync.storage, `users/${CloudSync.user.uid}/music/${id}_${file.name}`);
              await uploadBytes(sRef, file);
              cloudUrl = await getDownloadURL(sRef);
            } catch {}
          }
          const trackObj = {
            id,
            title: file.name.replace(/\.[^/.]+$/, ''),
            artist: CloudSync.isGoogleUser ? (CloudSync.user.displayName || 'My Library') : 'Local Upload',
            category: 'Uploaded',
            duration: 180,
            coverGradient: 'from-emerald-600 to-teal-700',
            isBuiltin: false,
            cloudUrl
          };
          await LocalDB.saveAudioBlob(id, file, trackObj);
          customTracks.push(trackObj);
          this.tracks.push(trackObj);
        }
        await LocalDB.setState('customAudioTracks', customTracks);
        App.toast('Audio uploaded to library!', 'success');
        if (App.currentView === 'music') App.renderCurrentView();
      },

      formatTime(sec) {
        const s = Math.floor(sec || 0);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      },

      updateProgressUI() {
        const track = this.getCurrentTrack();
        if (!track) return;
        const dur = track.isBuiltin ? track.duration : (track.source === 'youtube' ? (YouTubePlayerAPI.player?.getDuration?.() || track.duration || 0) : (this.audioEl.duration || track.duration || 0));
        const pct = dur ? Math.min(100, Math.round((this.progressSec / dur) * 100)) : 0;

        ['mini', 'full'].forEach((prefix) => {
          const bar = document.getElementById(`${prefix}-seek-bar`);
          const cur = document.getElementById(`${prefix}-time-current`);
          const tot = document.getElementById(`${prefix}-time-total`);
          if (bar) bar.value = pct;
          if (cur) cur.textContent = this.formatTime(this.progressSec);
          if (tot) tot.textContent = this.formatTime(dur);
        });
      },

      updateUI() {
        const track = this.getCurrentTrack();
        if (!track) return;
        const titleEl = document.getElementById('mini-track-title');
        const artistEl = document.getElementById('mini-track-artist');
        const btnEl = document.getElementById('mini-play-btn');
        const coverEl = document.getElementById('mini-cover');
        if (titleEl) titleEl.textContent = track.title;
        if (artistEl) artistEl.textContent = track.artist;
        if (coverEl) {
          coverEl.innerHTML = track.artworkUrl
            ? `<img src="${track.artworkUrl}" class="w-full h-full object-cover" alt="Cover" />`
            : `<i data-lucide="music" class="w-5 h-5"></i>`;
        }
        if (btnEl) {
          btnEl.innerHTML = this.isPlaying
            ? '<i data-lucide="pause" class="w-4 h-4"></i>'
            : '<i data-lucide="play" class="w-4 h-4 ml-0.5"></i>';
        }
        this.updateProgressUI();
        if (window.lucide) lucide.createIcons();
      }
    };

    // =========================================================================
    // MODULE 7: FOCUS TIMER ENGINE (services/focusEngine.js)
    // =========================================================================
    const FocusEngine = {
      mode: 'Focus',
      remainingSec: 25 * 60,
      totalSec: 25 * 60,
      running: false,
      timerId: null,

      setMode(mode, customMinutes = null) {
        this.pause();
        this.mode = mode;
        const s = Store.data.settings;
        const mins = customMinutes || (
          mode === 'Focus' ? (s.focusMinutes || 25) :
          mode === 'Short Break' ? (s.shortBreakMinutes || 5) :
          (s.longBreakMinutes || 15)
        );
        this.totalSec = mins * 60;
        this.remainingSec = this.totalSec;
        this.syncUI();
      },

      start() {
        if (this.running) return;
        this.running = true;
        this.timerId = setInterval(() => {
          if (this.remainingSec > 0) {
            this.remainingSec--;
            this.syncUI();
          } else {
            this.completeSession();
          }
        }, 1000);
        this.syncUI();
      },

      pause() {
        this.running = false;
        clearInterval(this.timerId);
        this.syncUI();
      },

      reset() {
        this.pause();
        this.remainingSec = this.totalSec;
        this.syncUI();
      },

      playChime() {
        if (!Store.data.settings.soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(528, ctx.currentTime);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1.2);
        } catch {}
      },

      async completeSession() {
        this.pause();
        this.playChime();
        const mins = Math.round(this.totalSec / 60);
        Store.data.focusSessions.unshift({
          id: 'fs_' + Date.now(),
          date: Store.todayStr(),
          mode: this.mode,
          durationMinutes: mins,
          completedAt: Date.now()
        });
        await Store.save('focusSessions');
        App.addNotification(`${this.mode} session (${mins}m) completed!`);
        App.toast(`${this.mode} session completed! +${mins}m logged.`, 'success');
        this.remainingSec = this.totalSec;
        if (App.currentView === 'dashboard' || App.currentView === 'focmyai') {
          App.renderCurrentView();
        }
      },

      formatClock() {
        const m = Math.floor(this.remainingSec / 60);
        const s = this.remainingSec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      },

      syncUI() {
        const clockStr = this.formatClock();
        document.querySelectorAll('.focus-clock-display').forEach((el) => (el.textContent = clockStr));
        const pct = this.totalSec ? Math.round(((this.totalSec - this.remainingSec) / this.totalSec) * 100) : 0;
        document.querySelectorAll('.focus-progress-bar').forEach((el) => (el.style.width = `${pct}%`));
      }
    };

    // =========================================================================
    // MODULE 8: GPS ACTIVITY TRACKER ENGINE (services/gpsEngine.js)
    // =========================================================================
    const GPSEngine = {
      status: 'idle',
      activityType: 'Running',
      coords: [],
      distanceKm: 0,
      elapsedSec: 0,
      watchId: null,
      timerId: null,
      map: null,
      polyline: null,
      marker: null,

      haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      },

      mountMap(containerId = 'gps-map-canvas') {
        const el = document.getElementById(containerId);
        if (!el || !window.L) return;
        if (this.map) {
          this.map.remove();
          this.map = null;
        }
        const defaultCenter = this.coords.length ? this.coords[this.coords.length - 1] : [-6.2088, 106.8456];
        this.map = L.map(containerId).setView(defaultCenter, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(this.map);

        this.polyline = L.polyline(this.coords, { color: '#3b82f6', weight: 5 }).addTo(this.map);
        this.marker = L.circleMarker(defaultCenter, {
          radius: 8,
          fillColor: '#a855f7',
          color: '#ffffff',
          weight: 2,
          fillOpacity: 1
        }).addTo(this.map);

        if (navigator.geolocation && this.coords.length === 0) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const pt = [pos.coords.latitude, pos.coords.longitude];
              if (this.map) this.map.setView(pt, 16);
              if (this.marker) this.marker.setLatLng(pt);
            },
            () => {}
          );
        }
      },

      start() {
        if (!navigator.geolocation) {
          App.toast('Geolocation API not supported in this browser.', 'error');
          return;
        }
        if (this.status === 'idle') {
          this.coords = [];
          this.distanceKm = 0;
          this.elapsedSec = 0;
        }
        this.status = 'tracking';
        this.timerId = setInterval(() => {
          this.elapsedSec++;
          this.updateLiveStats();
        }, 1000);

        this.watchId = navigator.geolocation.watchPosition(
          (pos) => {
            if (this.status !== 'tracking') return;
            const pt = [pos.coords.latitude, pos.coords.longitude];
            if (this.coords.length > 0) {
              const prev = this.coords[this.coords.length - 1];
              const delta = this.haversineKm(prev[0], prev[1], pt[0], pt[1]);
              if (delta > 0.002) {
                this.distanceKm += delta;
                this.coords.push(pt);
              }
            } else {
              this.coords.push(pt);
            }
            if (this.polyline) this.polyline.setLatLngs(this.coords);
            if (this.marker) this.marker.setLatLng(pt);
            if (this.map) this.map.panTo(pt);
            this.updateLiveStats();
          },
          (err) => App.toast('GPS Signal: ' + err.message, 'info'),
          { enableHighAccuracy: true, maximumAge: 2000 }
        );
        App.renderCurrentView();
      },

      pause() {
        this.status = 'paused';
        clearInterval(this.timerId);
        if (this.watchId !== null) navigator.geolocation.clearWatch(this.watchId);
        App.renderCurrentView();
      },

      async stopAndSave() {
        clearInterval(this.timerId);
        if (this.watchId !== null) navigator.geolocation.clearWatch(this.watchId);

        if (this.elapsedSec > 5) {
          const avgSpeedKmh = this.elapsedSec > 0 ? +(this.distanceKm / (this.elapsedSec / 3600)).toFixed(2) : 0;
          const paceMinPerKm = this.distanceKm > 0.05 ? (this.elapsedSec / 60) / this.distanceKm : 0;
          const paceStr = paceMinPerKm > 0
            ? `${Math.floor(paceMinPerKm)}:${String(Math.round((paceMinPerKm % 1) * 60)).padStart(2, '0')} /km`
            : '--:-- /km';

          Store.data.gpsActivities.unshift({
            id: 'gps_' + Date.now(),
            type: this.activityType,
            date: Store.todayStr(),
            distanceKm: +this.distanceKm.toFixed(2),
            durationSec: this.elapsedSec,
            avgPace: paceStr,
            avgSpeedKmh,
            coords: this.coords
          });
          await Store.save('gpsActivities');
          App.toast(`Saved ${this.activityType} (${this.distanceKm.toFixed(2)} km)!`, 'success');
        }
        this.status = 'idle';
        this.elapsedSec = 0;
        this.distanceKm = 0;
        this.coords = [];
        App.renderCurrentView();
      },

      updateLiveStats() {
        const dEl = document.getElementById('gps-live-dist');
        const tEl = document.getElementById('gps-live-time');
        const sEl = document.getElementById('gps-live-speed');
        const pEl = document.getElementById('gps-live-pace');
        if (dEl) dEl.textContent = `${this.distanceKm.toFixed(2)} km`;
        if (tEl) tEl.textContent = MusicEngine.formatTime(this.elapsedSec);
        const speed = this.elapsedSec > 0 ? (this.distanceKm / (this.elapsedSec / 3600)).toFixed(1) : '0.0';
        if (sEl) sEl.textContent = `${speed} km/h`;
        const paceMin = this.distanceKm > 0.02 ? (this.elapsedSec / 60) / this.distanceKm : 0;
        if (pEl) {
          pEl.textContent = paceMin > 0
            ? `${Math.floor(paceMin)}:${String(Math.round((paceMin % 1) * 60)).padStart(2, '0')} /km`
            : '--:--';
        }
      }
    };

    // =========================================================================
    // MODULE 9: MY AI INTELLIGENCE ENGINE (ONLINE GEMINI + LOCAL OFFLINE ENGINE)
    // =========================================================================

      getActiveChat() {

      buildUserContextSummary() {
        if (!Store.data.settings.aiAllowContext) {
          return 'User disabled personal data context sharing.';
        }
        const today = Store.todayStr();
        const tasks = Store.data.tasks || [];
        const openTasks = tasks.filter((t) => !t.completed).map((t) => `- [${t.priority}] ${t.title} (${t.category}, due ${t.dueDate || 'unscheduled'})`).join('\n');
        const habits = (Store.data.habits || []).map((h) => `- ${h.name} (Streak: ${Store.calculateHabitStreak(h.id)}d)`).join('\n');
        const goals = (Store.data.goals || []).map((g) => {
          const ms = g.milestones || [];
          const pct = ms.length ? Math.round((ms.filter((m) => m.done).length / ms.length) * 100) : 0;
          return `- ${g.title} (${g.category}, ${pct}% complete, target ${g.targetDate})`;
        }).join('\n');
        const sched = (Store.data.schedule || []).filter((s) => s.date === today).map((s) => `- ${s.start}-${s.end}: ${s.title}`).join('\n');
        const prod = Store.computeProductivityScore();

        return `USER LIVE MY DAILY DATA (${today}):
Productivity Score: ${prod.score}/100 (Tasks: ${prod.taskPct}%, Habits: ${prod.habitPct}%, Focus Today: ${prod.focusMinutes} mins, Goals: ${prod.goalPct}%).
OPEN TASKS:\n${openTasks || 'None'}
HABITS:\n${habits || 'None'}
GOALS:\n${goals || 'None'}
TODAY SCHEDULE:\n${sched || 'None'}`;
      },

      // Genuine Local Offline Assistant (never fakes an online API connection)
      async runLocalOfflineAssistant(prompt) {
        const lower = prompt.toLowerCase();
        const isID = Store.data.settings.language === 'id';
        const today = Store.todayStr();
        const openTasks = (Store.data.tasks || []).filter((t) => !t.completed);
        const prod = Store.computeProductivityScore();

        // Action 1: Create Task directly ("add task ...", "buat tugas ...")
        const addTaskMatch = prompt.match(/(?:add task|create task|new task|tambah tugas|buat tugas)[:\s-]+(.+)/i);
        if (addTaskMatch && addTaskMatch[1]) {
          const title = addTaskMatch[1].trim();
          Store.data.tasks.unshift({
            id: 'task_' + Date.now(),
            title,
            description: 'Created via MY AI Local Assistant',
            priority: 'High',
            category: 'AI Planned',
            dueDate: today,
            completed: false,
            recurring: false,
            subtasks: [],
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
          await Store.save('tasks');
          return isID
            ? `✅ [Asisten Lokal Offline] Tugas baru berhasil ditambahkan ke daftar Anda:\n• **"${title}"** (Prioritas: High, Tenggat: Hari Ini).`
            : `✅ [Local Offline Assistant] Created a new task in your workspace:\n• **"${title}"** (Priority: High, Due: Today).`;
        }

        // Action 2: Plan Day / Build Schedule
        if (lower.includes('plan') || lower.includes('schedule') || lower.includes('rencana') || lower.includes('jadwal')) {
          const topTasks = openTasks.slice(0, 3);
          if (!topTasks.length) {
            return isID
              ? `📋 [Asisten Lokal Offline] Anda tidak memiliki tugas tertunda hari ini. Skor produktivitas Anda saat ini **${prod.score}/100**. Gunakan waktu ini untuk meninjau target jangka panjang atau memulai sesi fokus 25 menit.`
              : `📋 [Local Offline Assistant] You have zero pending tasks today! Your productivity score is **${prod.score}/100**. Consider reviewing long-term goals or running a 25m Focus session.`;
          }
          const planLines = topTasks.map((t, i) => `${i + 1}. **${['09:00 - 10:30', '11:00 - 12:00', '14:00 - 15:30'][i]}** → [${t.priority}] ${t.title}`).join('\n');
          return isID
            ? `🗓️ [Asisten Lokal Offline] Berikut rekomendasi blok waktu harian berdasarkan tugas aktif Anda:\n\n${planLines}\n\nTip: Mulailah dengan tugas prioritas tertinggi dan aktifkan Timer Fokus 25 menit.`
            : `🗓️ [Local Offline Assistant] Here is an optimized time-block plan built from your active tasks:\n\n${planLines}\n\nTip: Start with your highest-priority block and launch a 25m Focus timer.`;
        }

        // Action 3: Prioritize Tasks
        if (lower.includes('priorit') || lower.includes('urgent') || lower.includes('penting')) {
          if (!openTasks.length) {
            return isID ? 'Semua tugas Anda sudah selesai!' : 'All your tasks are currently completed!';
          }
          const pOrder = { Urgent: 1, High: 2, Medium: 3, Low: 4 };
          const sorted = [...openTasks].sort((a, b) => (pOrder[a.priority] || 5) - (pOrder[b.priority] || 5));
          const listStr = sorted.map((t, idx) => `${idx + 1}. **[${t.priority}]** ${t.title} (${t.category})`).join('\n');
          return isID
            ? `🎯 [Asisten Lokal Offline] Urutan prioritas tugas Anda saat ini:\n\n${listStr}`
            : `🎯 [Local Offline Assistant] Here is your prioritized execution queue:\n\n${listStr}`;
        }

        // Action 4: Productivity & Habit Analysis
        return isID
          ? `📊 [Asisten Lokal Offline — Ringkasan Sistem]\n• **Skor Produktivitas:** ${prod.score}/100\n• **Tugas Hari Ini:** ${prod.taskPct}% selesai (${openTasks.length} tersisa)\n• **Kebiasaan Harian:** ${prod.habitPct}% tercapai\n• **Fokus Tercatat:** ${prod.focusMinutes} menit\n\n*Perintah cepat offline yang didukung:* ketik \`tambah tugas: [nama tugas]\`, \`rencanakan hariku\`, atau \`prioritaskan tugas\`.`
          : `📊 [Local Offline Assistant — Live Telemetry Summary]\n• **Productivity Score:** ${prod.score}/100\n• **Today's Tasks:** ${prod.taskPct}% complete (${openTasks.length} remaining)\n• **Daily Habits:** ${prod.habitPct}% completed\n• **Focus Logged:** ${prod.focusMinutes} mins\n\n*Supported offline commands:* try \`add task: [task name]\`, \`plan my day\`, or \`prioritize my tasks\`.`;
      },

      async sendPrompt(userText) {
        if (!userText.trim() || this.isGenerating) return;
        const chat = this.getActiveChat();
        if (!chat) return;

        chat.messages.push({ role: 'user', text: userText.trim(), ts: Date.now() });
        this.isGenerating = true;
        App.renderCurrentView();
        setTimeout(() => {
          const box = document.getElementById('ai-chat-scroll');
          if (box) box.scrollTop = box.scrollHeight;
        }, 30);

        // If device is offline, immediately use genuine Local Offline Assistant
        if (!navigator.onLine) {
          const offlineReply = await this.runLocalOfflineAssistant(userText.trim());
          chat.messages.push({ role: 'assistant', mode: 'offline', text: offlineReply, ts: Date.now() });
          this.isGenerating = false;
          await Store.save('aiChats');
          App.renderCurrentView();
          return;
        }

        const langName = Store.data.settings.language === 'id' ? 'Bahasa Indonesia' : 'English';
        const systemInstruction = `You are MY AI, the personal life management & productivity assistant built into MY DAILY.
Respond in ${langName}. Be proactive, concise, structured, and helpful. Use only the real user data provided below—never invent fake tasks or fake stats.\n\n${this.buildUserContextSummary()}`;

        const apiKey = '';
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userText.trim() }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] }
            })
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const result = await response.json();
          const replyText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          if (!replyText) throw new Error('Empty AI response');

          chat.messages.push({ role: 'assistant', mode: 'online', text: replyText, ts: Date.now() });
        } catch {
          // Seamless fallback to Local Offline Assistant when online AI backend is unreachable
          const fallbackReply = await this.runLocalOfflineAssistant(userText.trim());
          chat.messages.push({ role: 'assistant', mode: 'offline', text: fallbackReply, ts: Date.now() });
        }

        this.isGenerating = false;
        await Store.save('aiChats');
        App.renderCurrentView();
        setTimeout(() => {
          const box = document.getElementById('ai-chat-scroll');
          if (box) box.scrollTop = box.scrollHeight;
        }, 40);
      }
    };

      // Compute accessible text contrast (#ffffff or #050508) for any hex background
      getContrastColor(hex) {
        try {
          const clean = hex.replace('#', '');
          const r = parseInt(clean.substring(0, 2), 16);
          const g = parseInt(clean.substring(2, 4), 16);
          const b = parseInt(clean.substring(4, 6), 16);
          const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          return luminance > 0.62 ? '#050508' : '#ffffff';
        } catch {
          return '#ffffff';
        }
      },

      hexToRgba(hex, alpha) {
        try {
          const clean = hex.replace('#', '');
          const r = parseInt(clean.substring(0, 2), 16);
          const g = parseInt(clean.substring(2, 4), 16);
          const b = parseInt(clean.substring(4, 6), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        } catch {
          return `rgba(59, 130, 246, ${alpha})`;
        }
      },

      applyTheme() {
        const s = Store.data.settings;
        const html = document.documentElement;
        if (s.theme === 'light') {
          html.classList.remove('dark');
          html.classList.add('light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
        }

        const primary = s.primaryColor || '#3b82f6';
        const accent = s.accentColor || '#8b5cf6';
        const surface = s.surfaceTint || '#0d0f14';

        html.style.setProperty('--primary', primary);
        html.style.setProperty('--accent', accent);
        html.style.setProperty('--tertiary', accent);
        html.style.setProperty('--surface-tint', surface);
        html.style.setProperty('--text-on-primary', this.getContrastColor(primary));
        html.style.setProperty('--primary-glow', this.hexToRgba(primary, 0.35));
        html.style.setProperty('--accent-glow', this.hexToRgba(accent, 0.35));
      },

      // EXACT -1 HOUR OFFSET ON DASHBOARD CLOCK ONLY
      startClock() {
        const tick = () => {
          const adjustedNow = new Date(Date.now() - 3600000);
          const h = adjustedNow.getHours();
          const greet = h < 12 ? t('greetMorning') : h < 18 ? t('greetAfternoon') : t('greetEvening');
          const name = CloudSync.isGoogleUser && CloudSync.user?.displayName
            ? `, ${CloudSync.user.displayName.split(' ')[0]}`
            : '';
          const gEl = document.getElementById('header-greeting');
          const cEl = document.getElementById('header-clock');
          const dEl = document.getElementById('header-date-quote');

          if (gEl) gEl.textContent = `${greet}${name}`;
          if (cEl) cEl.textContent = adjustedNow.toLocaleTimeString('en-GB');
          if (dEl) {
            const lang = Store.data.settings.language === 'id' ? 'id-ID' : 'en-US';
            const dateStr = adjustedNow.toLocaleDateString(lang, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
            const qArr = QUOTES[Store.data.settings.language] || QUOTES.en;
            const quote = qArr[adjustedNow.getDate() % qArr.length];
            dEl.textContent = `${dateStr} • ${quote}`;
          }
        };
        tick();
        setInterval(tick, 1000);
      },

      afterDashboardMount() {
        const ctx = document.getElementById('dashboard-weekly-chart');
        if (!ctx || !window.Chart) return;

        const labels = [];
        const taskSeries = [];
        const habitSeries = [];
        const d = new Date();
        d.setDate(d.getDate() - 6);
        const locale = Store.data.settings.language === 'id' ? 'id-ID' : 'en-US';

        for (let i = 0; i < 7; i++) {
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          labels.push(d.toLocaleDateString(locale, { weekday: 'short' }));
          const tDone = (Store.data.tasks || []).filter((tk) => tk.completed && tk.dueDate === key).length;
          const hDone = (Store.data.habitLogs[key] || []).length;
          taskSeries.push(tDone);
          habitSeries.push(hDone);
          d.setDate(d.getDate() + 1);
        }

        const primary = Store.data.settings.primaryColor || '#3b82f6';
        const accent = Store.data.settings.accentColor || '#8b5cf6';

        const chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: t('tasksCompleted'), data: taskSeries, backgroundColor: primary, borderRadius: 6 },
              { label: t('habits'), data: habitSeries, backgroundColor: accent, borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#8a94a6', font: { size: 11 } } } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#8a94a6', font: { size: 11 } } },
              y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8a94a6', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
            }
          }
        });
        this.activeCharts.push(chart);
      },

      openCustomizeDashboardModal() {
        const widgets = Store.data.widgets || DEFAULT_WIDGETS;
        this.openModal(`
          <div class="flex items-center justify-between mb-4">
