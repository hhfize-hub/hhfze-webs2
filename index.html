      async addVisionImage(file) { if(!file) return; if(!file.type.startsWith('image/')){this.toast('Please select an image.','error');return;} if((Store.data.visionBoard||[]).length>=8){this.toast('Limit reached: 8 images to keep sync manageable.','info');return;} const reader=new FileReader(); reader.onload=async()=>{const im=new Image();im.onload=async()=>{const scale=Math.min(1,900/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);const compressed=canvas.toDataURL('image/jpeg',0.62);const title=prompt('Title for this vision?')||file.name;const note=prompt('Short note (optional):')||'';Store.data.visionBoard.unshift({id:'vision_'+Date.now(),title,note,image:compressed,createdAt:Date.now()});await Store.save('visionBoard');this.renderCurrentView();};im.src=reader.result;};reader.readAsDataURL(file); },
      async removeVision(id){Store.data.visionBoard=Store.data.visionBoard.filter(x=>x.id!==id);await Store.save('visionBoard');this.renderCurrentView();},
      viewFinance(){const f=Store.data.finance||{entries:[],budgets:[],savingsGoals:[],subscriptions:[]};const entries=f.entries||[];const income=entries.filter(e=>e.type==='income').reduce((a,e)=>a+Number(e.amount||0),0);const expense=entries.filter(e=>e.type==='expense').reduce((a,e)=>a+Number(e.amount||0),0);const fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);return `<div class="space-y-4 animate-view"><div><h1 class="text-xl sm:text-2xl font-extrabold">Finance & Money</h1><p class="text-xs text-mutedGray">Income, spending, budgets and savings</p></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-3"><div class="os-card p-4"><div class="text-xs text-mutedGray">Income</div><div class="text-lg font-extrabold text-emerald-400">${fmt(income)}</div></div><div class="os-card p-4"><div class="text-xs text-mutedGray">Expenses</div><div class="text-lg font-extrabold text-rose-400">${fmt(expense)}</div></div><div class="os-card p-4"><div class="text-xs text-mutedGray">Balance</div><div class="text-lg font-extrabold">${fmt(income-expense)}</div></div></div><div class="os-card p-4"><h3 class="font-bold text-sm mb-3">Add transaction</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><select id="fin-type" class="bg-slateDark border border-white/10 rounded-xl p-2 text-xs"><option value="expense">Expense</option><option value="income">Income</option></select><input id="fin-amount" type="number" min="1" placeholder="Amount (IDR)" class="bg-white/5 border border-white/10 rounded-xl p-2 text-xs"><input id="fin-category" placeholder="Category (e.g. food)" class="bg-white/5 border border-white/10 rounded-xl p-2 text-xs"><input id="fin-date" type="date" value="${new Date().toISOString().slice(0,10)}" class="bg-white/5 border border-white/10 rounded-xl p-2 text-xs"><input id="fin-note" placeholder="Note" class="bg-white/5 border border-white/10 rounded-xl p-2 text-xs sm:col-span-2"></div><button onclick="App.addFinanceEntry()" class="gradient-btn mt-3 px-4 py-2 rounded-xl text-xs font-bold">Save transaction</button></div><div class="os-card p-4"><h3 class="font-bold text-sm mb-3">Transaction history</h3><div class="space-y-2 max-h-[420px] overflow-y-auto">${entries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<div class="flex justify-between gap-3 border-b border-white/5 pb-2 text-xs"><div class="min-w-0"><div class="font-semibold truncate">${this.escapeHTML(e.category||'Other')} · ${this.escapeHTML(e.note||'')}</div><div class="text-mutedGray">${e.date||''}</div></div><div class="flex items-center gap-2 shrink-0 ${e.type==='income'?'text-emerald-400':'text-rose-400'}">${e.type==='income'?'+':'-'}${fmt(e.amount)}<button onclick="App.deleteFinanceEntry('${e.id}')" class="text-mutedGray ml-1">×</button></div></div>`).join('')||'<p class="text-xs text-mutedGray">No transactions yet.</p>'}</div></div></div>`;},
      async addFinanceEntry(){const amount=Number(document.getElementById('fin-amount')?.value);if(!(amount>0)){this.toast('Enter a valid amount.','error');return;}const f=Store.data.finance;f.entries.unshift({id:'fin_'+Date.now(),type:document.getElementById('fin-type').value,amount,category:document.getElementById('fin-category').value.trim()||'Other',date:document.getElementById('fin-date').value,note:document.getElementById('fin-note').value.trim()});await Store.save('finance');this.renderCurrentView();},
      async deleteFinanceEntry(id){Store.data.finance.entries=Store.data.finance.entries.filter(e=>e.id!==id);await Store.save('finance');this.renderCurrentView();},
      viewQR(){return `<div class="space-y-4 animate-view"><div><h1 class="text-xl sm:text-2xl font-extrabold">QR & Barcode Generator</h1><p class="text-xs text-mutedGray">Create a QR code for text, URLs, contact details, or Wi-Fi strings.</p></div><div class="os-card p-4 grid grid-cols-1 md:grid-cols-2 gap-4"><div class="space-y-3"><textarea id="qr-input" rows="4" oninput="App.renderQRPreview()" placeholder="Paste URL or text here…" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs"></textarea><div class="flex gap-2"><input id="qr-color" type="color" value="#111827" oninput="App.renderQRPreview()" class="w-12 h-10 rounded-lg"><select id="qr-size" onchange="App.renderQRPreview()" class="bg-slateDark border border-white/10 rounded-xl p-2 text-xs"><option value="180">Small</option><option value="256" selected>Medium</option><option value="360">Large</option></select></div><button onclick="App.downloadQR()" class="gradient-btn px-4 py-2 rounded-xl text-xs font-bold">Download PNG</button><select id="qr-mode" onchange="App.renderQRPreview()" class="bg-slateDark border border-white/10 rounded-xl p-2 text-xs"><option value="qr">QR code</option><option value="barcode">Barcode (Code 128)</option></select><button onclick="App.startQRScanner()" class="px-3 py-2 rounded-xl bg-white/10 text-xs">Scan QR / Barcode</button><div id="qr-scan-result" class="text-xs break-all text-mutedGray"></div><video id="qr-scanner-video" class="hidden w-full rounded-xl" autoplay playsinline></video><button onclick="App.stopQRScanner()" class="px-3 py-2 rounded-xl bg-white/10 text-xs">Stop scanner</button></div><div class="bg-white rounded-2xl min-h-64 flex items-center justify-center p-3"><div id="qr-preview"></div></div></div></div>`;},
      renderQRPreview(){const host=document.getElementById('qr-preview');if(!host)return;host.innerHTML='';const txt=document.getElementById('qr-input')?.value||'';if(!txt)return;const size=Number(document.getElementById('qr-size')?.value||256);const color=document.getElementById('qr-color')?.value||'#111827';if(document.getElementById('qr-mode')?.value==='barcode'){if(window.JsBarcode){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');host.appendChild(svg);try{JsBarcode(svg,txt,{format:'CODE128',lineColor:color,width:2,height:90,displayValue:true,background:'#ffffff'});}catch{host.textContent='Invalid barcode input';}}return;}if(window.QRCode)new QRCode(host,{text:txt,width:size,height:size,colorDark:color,colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});},
      downloadQR(){const img=document.querySelector('#qr-preview img');const canvas=document.querySelector('#qr-preview canvas');const svg=document.querySelector('#qr-preview svg');let src=img?.src||(canvas?.toDataURL('image/png'));let filename='mydaily-qr.png';if(!src&&svg){src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));filename='mydaily-barcode.svg';}if(!src){this.toast('Generate a code first.','error');return;}const a=document.createElement('a');a.href=src;a.download=filename;a.click();},
      qrScanStream:null,qrScanFrame:null,async startQRScanner(){const v=document.getElementById('qr-scanner-video'),r=document.getElementById('qr-scan-result');if(!v||!('BarcodeDetector' in window)){if(r)r.textContent='Camera scanning unsupported in this browser.';return;}try{this.qrScanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.classList.remove('hidden');v.srcObject=this.qrScanStream;const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8']});const scan=async()=>{if(!this.qrScanStream)return;try{const found=await detector.detect(v);if(found.length){r.textContent='Scanned: '+found[0].rawValue;const value=found[0].rawValue;if(/^https?:\/\//i.test(value)){const a=document.createElement('a');a.href=value;a.target='_blank';a.rel='noopener';a.textContent=' Open link';r.appendChild(a);}else{const b=document.createElement('button');b.textContent=' Copy';b.onclick=()=>navigator.clipboard.writeText(value);r.appendChild(b);}}else this.qrScanFrame=requestAnimationFrame(scan);}catch{this.qrScanFrame=requestAnimationFrame(scan);}};v.onloadedmetadata=scan;}catch{if(r)r.textContent='Camera permission denied or unavailable.';}},stopQRScanner(){if(this.qrScanFrame)cancelAnimationFrame(this.qrScanFrame);if(this.qrScanStream){this.qrScanStream.getTracks().forEach(t=>t.stop());this.qrScanStream=null;}const v=document.getElementById('qr-scanner-video');if(v){v.srcObject=null;v.classList.add('hidden');}},
      async loadWeather(){const el=document.getElementById('weather-card-content');if(!el)return;el.innerHTML='<span class="animate-pulse">Getting location and weather…</span>';if(!navigator.geolocation){el.textContent='Location not supported by this browser.';return;}navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude,longitude}=pos.coords;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);if(!r.ok)throw new Error();const d=await r.json();const c=d.current;const code=c.weather_code;const labels={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',80:'Rain showers',95:'Thunderstorm'};el.innerHTML=`<div class="flex items-center gap-4"><div class="text-4xl">${code===0?'☀️':code<4?'🌤️':code<50?'🌫️':code<70?'🌧️':code<80?'❄️':'⛈️'}</div><div><div class="text-2xl font-extrabold">${Math.round(c.temperature_2m)}°C · ${labels[code]||'Weather'}</div><div class="text-xs text-mutedGray">Humidity ${c.relative_humidity_2m}% · Wind ${c.wind_speed_10m} km/h</div><div class="text-xs text-mutedGray mt-1">Today ${d.daily.temperature_2m_min[0]}° / ${d.daily.temperature_2m_max[0]}°</div></div>`;}catch{el.textContent='Weather service unavailable. Try again later.';}},()=>{el.textContent='Location permission denied or unavailable.';},{timeout:12000,enableHighAccuracy:false});},

      // =======================================================================
      // VIEW 2: TASKS
      // =======================================================================
      viewTasks() {
        const today = Store.todayStr();
        let list = [...(Store.data.tasks || [])];

        if (this.taskFilter === 'Today') list = list.filter((tk) => tk.dueDate === today);
        else if (this.taskFilter === 'Upcoming') list = list.filter((tk) => tk.dueDate && tk.dueDate > today && !tk.completed);
        else if (this.taskFilter === 'Completed') list = list.filter((tk) => tk.completed);
        else if (this.taskFilter === 'Overdue') list = list.filter((tk) => tk.dueDate && tk.dueDate < today && !tk.completed);

        if (this.taskSearch.trim()) {
          const q = this.taskSearch.toLowerCase();
          list = list.filter((tk) => tk.title.toLowerCase().includes(q) || (tk.category || '').toLowerCase().includes(q));
        }

        const pRank = { Urgent: 4, High: 3, Medium: 2, Low: 1 };
        if (this.taskSort === 'priority') list.sort((a, b) => (pRank[b.priority] || 0) - (pRank[a.priority] || 0));
        else if (this.taskSort === 'dueDate') list.sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));

        const filters = [
          { id: 'All', label: t('filterAll') },
          { id: 'Today', label: t('filterToday') },
          { id: 'Upcoming', label: t('filterUpcoming') },
          { id: 'Completed', label: t('filterCompleted') },
          { id: 'Overdue', label: t('filterOverdue') }
        ];

        return `
          <div class="space-y-5 animate-view">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">${t('myTasksTitle')}</h1>
                <p class="text-xs text-mutedGray">${t('myTasksSub')}</p>
              </div>
              <button onclick="App.openTaskModal()" class="gradient-btn px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i> ${t('newTask')}
              </button>
            </div>

            <div class="os-card p-3.5 sm:p-4 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                ${filters.map((f) => `
                  <button onclick="App.taskFilter='${f.id}'; App.renderCurrentView()" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0 ${
                    this.taskFilter === f.id ? 'theme-primary-bg' : 'bg-white/[0.04] text-mutedGray hover:text-white'
                  }">${f.label}</button>`).join('')}
              </div>
              <div class="flex items-center gap-2 flex-1 sm:flex-initial">
                <input
                  type="text"
                  value="${this.escapeHTML(this.taskSearch)}"
                  oninput="App.taskSearch=this.value; App.renderCurrentView()"
                  placeholder="${t('filterTasksPlaceholder')}"
                  class="bg-white/[0.04] border border-white/10 rounded-xl px-3 py-1.5 text-xs outline-none w-full sm:w-44"
                />
                <select onchange="App.taskSort=this.value; App.renderCurrentView()" class="bg-slateDark border border-white/10 rounded-xl px-2.5 py-1.5 text-xs outline-none">
                  <option value="priority" ${this.taskSort === 'priority' ? 'selected' : ''}>${t('sortPriority')}</option>
                  <option value="dueDate" ${this.taskSort === 'dueDate' ? 'selected' : ''}>${t('sortDeadline')}</option>
                  <option value="manual" ${this.taskSort === 'manual' ? 'selected' : ''}>${t('sortManual')}</option>
                </select>
              </div>
            </div>

            <div class="space-y-2.5">
              ${list.map((tk) => {
                const subs = tk.subtasks || [];
                const subDone = subs.filter((s) => s.done).length;
                return `
                  <div
                    draggable="true"
                    ondragstart="App.dragTaskId='${tk.id}'"
                    ondragover="event.preventDefault()"
                    ondrop="App.dropTask('${tk.id}')"
                    class="os-card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 cursor-grab active:cursor-grabbing"
                  >
                    <div class="flex items-start gap-3 min-w-0 flex-1">
                      <button onclick="App.toggleTask('${tk.id}')" class="mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition ${
                        tk.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-mutedGray/60'
                      }">
                        ${tk.completed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                      </button>
                      <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-sm font-bold ${tk.completed ? 'line-through text-mutedGray' : ''}">${this.escapeHTML(tk.title)}</span>
                          <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${this.priorityBadgeClass(tk.priority)}">${tk.priority}</span>
                          <span class="text-[10px] px-2 py-0.5 rounded bg-white/10 text-mutedGray">${this.escapeHTML(tk.category || 'General')}</span>
                        </div>
                        ${tk.description ? `<p class="text-xs text-mutedGray mt-1">${this.escapeHTML(tk.description)}</p>` : ''}
                        ${subs.length ? `
                          <div class="mt-2 space-y-1 pl-2 border-l border-white/10">
                            ${subs.map((st, sIdx) => `
                              <label class="flex items-center gap-2 text-[11px] text-mutedGray hover:text-white cursor-pointer">
                                <input type="checkbox" ${st.done ? 'checked' : ''} onchange="App.toggleSubtask('${tk.id}', ${sIdx})" />
                                <span class="${st.done ? 'line-through' : ''}">${this.escapeHTML(st.title)}</span>
                              </label>`).join('')}
                          </div>` : ''}
                      </div>
                    </div>

                    <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                      ${tk.dueDate ? `<span class="text-[11px] font-mono px-2 py-1 rounded-lg bg-white/[0.04] text-mutedGray">${tk.dueDate}</span>` : ''}
                      ${subs.length ? `<span class="text-[10px] font-mono theme-primary-text">${subDone}/${subs.length}</span>` : ''}
                      <button onclick="App.openTaskModal('${tk.id}')" class="p-1.5 rounded-lg hover:bg-white/10 text-mutedGray hover:text-white"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                      <button onclick="App.deleteTask('${tk.id}')" class="p-1.5 rounded-lg hover:bg-rose-500/20 text-mutedGray hover:text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>
        `;
      },

      openTaskModal(editId = null) {
        const task = editId ? Store.data.tasks.find((tk) => tk.id === editId) : null;
        const subText = task && task.subtasks ? task.subtasks.map((s) => s.title).join('\n') : '';
        this.openModal(`
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold">${task ? 'Edit Task' : t('newTask')}</h3>
            <button onclick="App.closeModal()" class="p-1.5 rounded-lg hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <form onsubmit="App.saveTaskForm(event, '${editId || ''}')" class="space-y-3 text-xs">
            <input id="tf-title" required placeholder="Title *" value="${task ? this.escapeHTML(task.title) : ''}" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none" />
            <textarea id="tf-desc" rows="2" placeholder="Description" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none">${task ? this.escapeHTML(task.description || '') : ''}</textarea>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="tf-priority" class="w-full bg-slateDark border border-white/10 rounded-xl px-2.5 py-2 outline-none">
                ${['Low', 'Medium', 'High', 'Urgent'].map((p) => `<option ${task?.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
              <input id="tf-category" value="${task ? this.escapeHTML(task.category || 'Work') : 'Work'}" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none" />
              <input id="tf-date" type="date" value="${task?.dueDate || Store.todayStr()}" class="w-full bg-slateDark border border-white/10 rounded-xl px-2.5 py-2 outline-none" />
            </div>
            <textarea id="tf-subtasks" rows="3" placeholder="Subtasks (one per line)" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none">${this.escapeHTML(subText)}</textarea>
            <label class="flex items-center gap-2 cursor-pointer">
              <input id="tf-recurring" type="checkbox" ${task?.recurring ? 'checked' : ''} />
              <span>Recurring</span>
            </label>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="App.closeModal()" class="px-4 py-2 rounded-xl bg-white/5">${t('cancel')}</button>
              <button type="submit" class="gradient-btn px-4 py-2 rounded-xl font-semibold">${t('save')}</button>
            </div>
          </form>
        `);
      },

      async saveTaskForm(e, editId) {
        e.preventDefault();
        const title = document.getElementById('tf-title').value.trim();
        const description = document.getElementById('tf-desc').value.trim();
        const priority = document.getElementById('tf-priority').value;
        const category = document.getElementById('tf-category').value.trim() || 'General';
        const dueDate = document.getElementById('tf-date').value;
        const recurring = document.getElementById('tf-recurring').checked;
        const subLines = document.getElementById('tf-subtasks').value.split('\n').map((l) => l.trim()).filter(Boolean);

        if (editId) {
          const idx = Store.data.tasks.findIndex((tk) => tk.id === editId);
          if (idx > -1) {
            const oldSubs = Store.data.tasks[idx].subtasks || [];
            Store.data.tasks[idx] = {
              ...Store.data.tasks[idx],
              title, description, priority, category, dueDate, recurring,
              subtasks: subLines.map((line, i) => ({ id: 'st_' + i, title: line, done: oldSubs[i]?.done || false })),
              updatedAt: Date.now()
            };
          }
        } else {
          Store.data.tasks.unshift({
            id: 'task_' + Date.now(),
            title, description, priority, category, dueDate,
            completed: false, recurring,
            subtasks: subLines.map((line, i) => ({ id: 'st_' + i, title: line, done: false })),
            createdAt: Date.now(), updatedAt: Date.now()
          });
        }
        await Store.save('tasks');
        this.closeModal();
        this.renderCurrentView();
      },

      async toggleTask(id) {
        const tk = Store.data.tasks.find((x) => x.id === id);
        if (!tk) return;
        tk.completed = !tk.completed;
        tk.updatedAt = Date.now();
        await Store.save('tasks');
        this.renderCurrentView();
      },

      async toggleSubtask(taskId, subIdx) {
        const tk = Store.data.tasks.find((x) => x.id === taskId);
        if (!tk || !tk.subtasks[subIdx]) return;
        tk.subtasks[subIdx].done = !tk.subtasks[subIdx].done;
        tk.updatedAt = Date.now();
        await Store.save('tasks');
        this.renderCurrentView();
      },

      async deleteTask(id) {
        Store.data.tasks = Store.data.tasks.filter((tk) => tk.id !== id);
        await Store.save('tasks');
        this.renderCurrentView();
      },

      async dropTask(targetId) {
        if (!this.dragTaskId || this.dragTaskId === targetId) return;
        const arr = Store.data.tasks;
        const fromIdx = arr.findIndex((tk) => tk.id === this.dragTaskId);
        const toIdx = arr.findIndex((tk) => tk.id === targetId);
        if (fromIdx > -1 && toIdx > -1) {
          const [moved] = arr.splice(fromIdx, 1);
          arr.splice(toIdx, 0, moved);
          this.taskSort = 'manual';
          await Store.save('tasks');
          this.renderCurrentView();
        }
      },

      // =======================================================================
      // VIEW 3: CALENDAR

        const year = this.calDate.getFullYear();

              </div>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="App.calView='month'; App.renderCurrentView()" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${this.calView === 'month' ? 'theme-accent-bg' : 'bg-white/5 text-mutedGray'}">${t('monthView')}</button>
              <button onclick="App.calView='agenda'; App.renderCurrentView()" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${this.calView === 'agenda' ? 'theme-accent-bg' : 'bg-white/5 text-mutedGray'}">${t('agendaView')}</button>
            </div>

            ${this.calView === 'month' ? `
              <div class="os-card p-3 sm:p-4 overflow-x-auto">

                    const holiday = ID_HOLIDAYS[cell.dateStr];
                    const dayTasks = (Store.data.tasks || []).filter((tk) => tk.dueDate === cell.dateStr);

      // =======================================================================
      // VIEW 6: HABITS
      // =======================================================================
      viewHabits() {
        const today = Store.todayStr();
        const todayDone = Store.data.habitLogs[today] || [];
        const heatCells = [];
        const d = new Date();
        d.setDate(d.getDate() - 83);
        const totalHabits = Math.max(1, (Store.data.habits || []).length);

        for (let i = 0; i < 84; i++) {
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const count = (Store.data.habitLogs[key] || []).length;
          const ratio = count / totalHabits;
          const level = count === 0 ? 0 : ratio < 0.4 ? 1 : ratio < 0.8 ? 2 : 3;
          heatCells.push({ key, count, level });
          d.setDate(d.getDate() + 1);
        }

        const levelColors = ['bg-white/[0.04]', 'bg-blue-500/35', 'bg-purple-500/65', 'theme-primary-bg'];

        return `
          <div class="space-y-5 animate-view">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">${t('habitsTitle')}</h1>
                <p class="text-xs text-mutedGray">${t('habitsSub')}</p>
              </div>
              <button onclick="App.openHabitModal()" class="gradient-btn px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">

                <div class="flex items-center gap-1.5 text-[10px] text-mutedGray">
                  <span>${t('less')}</span>
                  ${levelColors.map((c) => `<span class="w-3 h-3 rounded-sm ${c}"></span>`).join('')}
                  <span>${t('more')}</span>
                </div>
              </div>
              <div class="grid grid-cols-14 sm:grid-cols-21 md:grid-cols-28 gap-1.5">
                ${heatCells.map((c) => `<div title="${c.key}: ${c.count}" class="h-4 rounded-sm ${levelColors[c.level]} border border-white/5"></div>`).join('')}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${(Store.data.habits || []).map((h) => {
                const isDone = todayDone.includes(h.id);
                const streak = Store.calculateHabitStreak(h.id);
                return `
                  <div class="os-card p-4 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <button onclick="App.toggleHabitToday('${h.id}')" class="w-10 h-10 rounded-xl flex items-center justify-center transition shrink-0 ${
                        isDone ? 'bg-emerald-500 text-white' : 'bg-white/[0.05] border border-white/10 text-mutedGray'
                      }">
                        <i data-lucide="check" class="w-5 h-5"></i>
                      </button>
                      <div class="min-w-0">
                        <div class="text-sm font-bold truncate">${this.escapeHTML(h.name)}</div>
                        <div class="text-[11px] text-mutedGray">${h.category} • ${h.frequency}</div>
                      </div>
                    </div>

          </div>
        `;
      },

      drawWheelCanvas() {
        const canvas = document.getElementById('decision-wheel-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const wheel = (Store.data.wheels || []).find((w) => w.id === this.selectedWheelId);
        const opts = wheel?.options || [];
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = cx - 10;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!opts.length) return;

        const arc = (2 * Math.PI) / opts.length;
        opts.forEach((opt, i) => {
          const start = this.wheelAngle + i * arc;
          const end = start + arc;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, start, end);
          ctx.fillStyle = opt.color || '#3b82f6';
          ctx.fill();
          ctx.strokeStyle = '#050508';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(start + arc / 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px Inter, sans-serif';
          ctx.fillText(opt.label.slice(0, 18), r - 14, 4);
          ctx.restore();
        });
      },

      spinWheel() {
        if (this.wheelSpinning) return;
        const wheel = (Store.data.wheels || []).find((w) => w.id === this.selectedWheelId);
        if (!wheel || !wheel.options.length) return;

        this.wheelSpinning = true;
        let velocity = 0.35 + Math.random() * 0.25;
        const friction = 0.985;

        const animate = async () => {
          this.wheelAngle += velocity;
          velocity *= friction;
          this.drawWheelCanvas();

          if (velocity > 0.002) {
            requestAnimationFrame(animate);
          } else {
            this.wheelSpinning = false;
            const arc = (2 * Math.PI) / wheel.options.length;
            const normalized = ((1.5 * Math.PI - (this.wheelAngle % (2 * Math.PI))) + 2 * Math.PI) % (2 * Math.PI);
            const winIdx = Math.floor(normalized / arc) % wheel.options.length;
            const winner = wheel.options[winIdx];

            const resEl = document.getElementById('wheel-result-banner');
            if (resEl) resEl.textContent = `🎯 ${winner.label}`;
            Store.data.wheelHistory.unshift({ wheelName: wheel.name, result: winner.label, ts: Date.now() });
            await Store.save('wheelHistory');
          }
        };
        requestAnimationFrame(animate);
      },

        `;
      },

      mountStatsCharts() {
        if (!window.Chart) return;
        const catMap = {};
        (Store.data.tasks || []).forEach((tk) => {
          const c = tk.category || 'General';
          catMap[c] = (catMap[c] || 0) + 1;
        });

        const primary = Store.data.settings.primaryColor || '#3b82f6';
        const accent = Store.data.settings.accentColor || '#8b5cf6';

        const c1 = document.getElementById('stats-cat-chart');
        if (c1) {
          this.activeCharts.push(
            new Chart(c1, {
              type: 'doughnut',
              data: {
                labels: Object.keys(catMap),
                datasets: [{ data: Object.values(catMap), backgroundColor: [primary, accent, '#a855f7', '#10b981', '#f59e0b'], borderWidth: 0 }]
              },
              options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8a94a6' } } } }
            })
          );
        }

        const c2 = document.getElementById('stats-goal-chart');
        if (c2) {
          const goals = Store.data.goals || [];
          this.activeCharts.push(
            new Chart(c2, {
              type: 'bar',
              data: {
                labels: goals.map((g) => g.title.slice(0, 20)),
                datasets: [{
                  label: '%',
                  data: goals.map((g) => {
                    const ms = g.milestones || [];
                    return ms.length ? Math.round((ms.filter((m) => m.done).length / ms.length) * 100) : 0;
                  }),
                  backgroundColor: accent,
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { max: 100, beginAtZero: true, ticks: { color: '#8a94a6' } }, x: { ticks: { color: '#8a94a6' } } }
              }
            })
          );
        }
      },

      // =======================================================================
      // VIEW 14: NOTES
      // =======================================================================
      viewNotes() {
        let notes = [...(Store.data.notes || [])];
        if (this.noteSearch.trim()) {
          const q = this.noteSearch.toLowerCase();
          notes = notes.filter((n) => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));
        }
        notes.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

        return `
          <div class="space-y-5 animate-view">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">${t('notesTitle')}</h1>
                <p class="text-xs text-mutedGray">${t('notesSub')}</p>
              </div>
              <div class="flex items-center gap-2">
                <input value="${this.escapeHTML(this.noteSearch)}" oninput="App.noteSearch=this.value; App.renderCurrentView()" placeholder="${t('searchNotesPlaceholder')}" class="bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 text-xs outline-none" />
                <button onclick="App.openNoteModal()" class="gradient-btn px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i> ${t('newNote')}</button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${notes.map((n) => `
                <div class="os-card p-5 flex flex-col justify-between border-t-4" style="border-top-color:${n.color || '#3b82f6'}">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-[10px] px-2 py-0.5 rounded bg-white/10 text-mutedGray">${this.escapeHTML(n.category || 'Note')}</span>
                      <div class="flex items-center gap-1.5">
                        <button onclick="App.togglePinNote('${n.id}')" class="p-1 rounded ${n.pinned ? 'theme-primary-text' : 'text-mutedGray'}"><i data-lucide="pin" class="w-3.5 h-3.5"></i></button>
                        <button onclick="App.openNoteModal('${n.id}')" class="p-1 rounded text-mutedGray hover:text-white"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                        <button onclick="App.deleteNote('${n.id}')" class="p-1 rounded text-mutedGray hover:text-rose-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                    <h3 class="text-sm font-bold mb-2">${this.escapeHTML(n.title)}</h3>
                    <p class="text-xs text-mutedGray whitespace-pre-line line-clamp-6">${this.escapeHTML(n.content)}</p>
                  </div>
                </div>`).join('')}
            </div>
          </div>
        `;
      },

      openNoteModal(editId = null) {
        const note = editId ? Store.data.notes.find((n) => n.id === editId) : null;
        this.openModal(`
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold">${note ? 'Edit Note' : t('newNote')}</h3>
            <button onclick="App.closeModal()" class="p-1.5 rounded-lg hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <form onsubmit="App.saveNoteForm(event, '${editId || ''}')" class="space-y-3 text-xs">
            <input id="nt-title" required placeholder="Title" value="${note ? this.escapeHTML(note.title) : ''}" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none" />
            <div class="grid grid-cols-2 gap-2">
              <input id="nt-cat" value="${note ? this.escapeHTML(note.category || 'Personal') : 'Personal'}" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none" />
              <input id="nt-color" type="color" value="${note?.color || '#3b82f6'}" class="w-full h-9 bg-slateDark border border-white/10 rounded-xl px-1" />
            </div>
            <textarea id="nt-content" rows="6" required placeholder="Content..." class="w-full bg-white/[0.05] border border-white/10 rounded-xl p-3 outline-none">${note ? this.escapeHTML(note.content) : ''}</textarea>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="App.closeModal()" class="px-4 py-2 rounded-xl bg-white/5">${t('cancel')}</button>
              <button type="submit" class="gradient-btn px-4 py-2 rounded-xl font-semibold">${t('save')}</button>
            </div>
          </form>
        `);
      },

      async saveNoteForm(e, editId) {
        e.preventDefault();
        const title = document.getElementById('nt-title').value.trim();
        const category = document.getElementById('nt-cat').value.trim();
        const color = document.getElementById('nt-color').value;
        const content = document.getElementById('nt-content').value;

        if (editId) {
          const idx = Store.data.notes.findIndex((n) => n.id === editId);
          if (idx > -1) Store.data.notes[idx] = { ...Store.data.notes[idx], title, category, color, content, updatedAt: Date.now() };
        } else {
          Store.data.notes.unshift({ id: 'note_' + Date.now(), title, category, color, content, pinned: false, favorite: false, updatedAt: Date.now() });
        }
        await Store.save('notes');
        this.closeModal();
        this.renderCurrentView();
      },

      async togglePinNote(id) {
        const n = Store.data.notes.find((x) => x.id === id);
        if (n) { n.pinned = !n.pinned; await Store.save('notes'); this.renderCurrentView(); }
      },

      async deleteNote(id) {
        Store.data.notes = Store.data.notes.filter((n) => n.id !== id);
        await Store.save('notes');
        this.renderCurrentView();
      },

      // =======================================================================
      // VIEW 15: SETTINGS (CLEAN CONSUMER UI + CUSTOM THEME COLOR PICKERS)
      // =======================================================================
      viewSettings() {
        const s = Store.data.settings;
        const presets = [
          { name: 'Electric Royal', primary: '#3b82f6', accent: '#8b5cf6', surface: '#0d0f14' },
          { name: 'Emerald Cyber', primary: '#10b981', accent: '#06b6d4', surface: '#0a1214' },
          { name: 'Crimson Nebula', primary: '#f43f5e', accent: '#a855f7', surface: '#140c12' },
          { name: 'Solar Amber', primary: '#f59e0b', accent: '#ec4899', surface: '#14100b' }
        ];

        return `
          <div class="space-y-5 animate-view max-w-4xl">
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">${t('settingsTitle')}</h1>
              <p class="text-xs text-mutedGray">${t('settingsSub')}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Appearance & Language -->
              <div class="os-card p-5 space-y-4 text-xs">
                <h3 class="text-sm font-bold">${t('appearanceGeneral')}</h3>
                <div>
                  <label class="block text-mutedGray mb-1">${t('languageLabel')}</label>
                  <select onchange="App.updateSetting('language', this.value)" class="w-full bg-slateDark border border-white/10 rounded-xl px-3 py-2 outline-none">
                    <option value="en" ${s.language === 'en' ? 'selected' : ''}>English (US)</option>
                    <option value="id" ${s.language === 'id' ? 'selected' : ''}>Bahasa Indonesia</option>
                  </select>
                </div>
                <div>
                  <label class="block text-mutedGray mb-1">${t('themeMode')}</label>
                  <select onchange="App.updateSetting('theme', this.value)" class="w-full bg-slateDark border border-white/10 rounded-xl px-3 py-2 outline-none">
                    <option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>${t('darkMode')}</option>
                    <option value="light" ${s.theme === 'light' ? 'selected' : ''}>${t('lightMode')}</option>
                  </select>
                </div>
                <label class="flex items-center justify-between pt-2 border-t border-white/10 cursor-pointer">
                  <span>MY AI Data Context Access</span>
                  <input type="checkbox" ${s.aiAllowContext !== false ? 'checked' : ''} onchange="App.updateSetting('aiAllowContext', this.checked)" />
                </label>
              </div>

              <!-- Custom Color Theme Engine -->
              <div class="os-card p-5 space-y-4 text-xs">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-bold">${t('customColorsTitle')}</h3>
                  <button onclick="App.resetThemeColors()" class="text-[11px] theme-primary-text hover:underline font-semibold">${t('resetColors')}</button>
                </div>

                <div class="grid grid-cols-3 gap-2.5">
                  <div>
                    <label class="block text-[11px] text-mutedGray mb-1">${t('primaryColor')}</label>
                    <input type="color" value="${s.primaryColor || '#3b82f6'}" onchange="App.updateSetting('primaryColor', this.value)" class="w-full h-10 rounded-xl bg-transparent border border-white/15 cursor-pointer" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-mutedGray mb-1">${t('accentColor')}</label>
                    <input type="color" value="${s.accentColor || '#8b5cf6'}" onchange="App.updateSetting('accentColor', this.value)" class="w-full h-10 rounded-xl bg-transparent border border-white/15 cursor-pointer" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-mutedGray mb-1">${t('surfaceTint')}</label>
                    <input type="color" value="${s.surfaceTint || '#0d0f14'}" onchange="App.updateSetting('surfaceTint', this.value)" class="w-full h-10 rounded-xl bg-transparent border border-white/15 cursor-pointer" />
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                  ${presets.map((p) => `
                    <button onclick="App.applyColorPreset('${p.primary}', '${p.accent}', '${p.surface}')" class="flex items-center gap-2 p-2 rounded-xl bg-white/[0.04] hover:bg-white/10 border border-white/10 text-left">
                      <span class="w-4 h-4 rounded-full shrink-0" style="background:linear-gradient(135deg, ${p.primary}, ${p.accent})"></span>
                      <span class="text-[11px] font-medium truncate">${p.name}</span>
                    </button>`).join('')}
                </div>
              </div>

              <!-- Productivity Defaults -->
              <div class="os-card p-5 space-y-4 text-xs md:col-span-2">
                <h3 class="text-sm font-bold">${t('productivityDefaults')}</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-mutedGray mb-1">${t('pomodoroFocusMins')}</label>
                    <input type="number" value="${s.focusMinutes || 25}" onchange="App.updateSetting('focusMinutes', +this.value)" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none" />
                  </div>
                  <div>
                    <label class="block text-mutedGray mb-1">${t('shortBreakMins')}</label>
                    <input type="number" value="${s.shortBreakMinutes || 5}" onchange="App.updateSetting('shortBreakMinutes', +this.value)" class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-3 py-2 outline-none" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      async updateSetting(key, val) {
        Store.data.settings[key] = val;
        await Store.save('settings');
        this.applyTheme();
        this.applyLanguageChrome();
        this.renderSidebar();
        this.renderAuthUI();
        this.renderCurrentView();
        this.toast('Settings updated!', 'success');
      },

      async applyColorPreset(primary, accent, surface) {
        Store.data.settings.primaryColor = primary;
        Store.data.settings.accentColor = accent;
        Store.data.settings.surfaceTint = surface;
        await Store.save('settings');
        this.applyTheme();
        this.renderCurrentView();
        this.toast('Theme colors applied!', 'success');
      },

      async resetThemeColors() {
        await this.applyColorPreset('#3b82f6', '#8b5cf6', '#0d0f14');
      },

      // =======================================================================
      // VIEW 16: PROFILE & ACCOUNT SYNC (CLEAN CONSUMER UI)
      // =======================================================================
      viewProfile() {
        const isGoogle = CloudSync.isGoogleUser && CloudSync.user;
        const u = CloudSync.user;
        return `
          <div class="space-y-5 animate-view max-w-2xl">
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">${t('profileTitle')}</h1>
              <p class="text-xs text-mutedGray">${t('profileSub')}</p>
            </div>

            <div class="os-card p-6 space-y-5">
              ${isGoogle ? `
                <div class="flex flex-wrap items-center gap-4">
                  <img src="${u.photoURL || ''}" class="w-16 h-16 rounded-2xl border border-white/20 object-cover" alt="User Avatar" />
                  <div>
                    <h2 class="text-lg font-extrabold">${this.escapeHTML(u.displayName || 'MY DAILY User')}</h2>
                    <p class="text-xs text-mutedGray">${this.escapeHTML(u.email || '')}</p>
                    <span class="inline-flex items-center gap-1.5 mt-2 text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-semibold">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ${t('cloudSynced')}
                    </span>
                  </div>
                </div>
                <div class="pt-4 border-t border-white/10 flex flex-wrap gap-3">
                  <button onclick="CloudSync.pushAllToCloud(); App.toast('All data synced!', 'success')" class="gradient-btn px-4 py-2 rounded-xl text-xs font-semibold">${t('saveAndSync')}</button>
                  <button onclick="CloudSync.signOutGoogle()" class="px-4 py-2 rounded-xl bg-rose-500/15 text-rose-400 hover:bg-rose-500/25 text-xs font-semibold">${t('signOut')}</button>
                </div>` : `
                <div class="space-y-3">
                  <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/15 text-blue-400 text-xs font-semibold">
                    <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i> ${t('guestMode')}
                  </div>
                  <h2 class="text-lg font-extrabold">${t('guestMode')}</h2>
                  <p class="text-xs text-mutedGray leading-relaxed">${t('guestDesc')}</p>
                  <button onclick="CloudSync.signInWithGoogle()" class="gradient-btn px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2">
                    <i data-lucide="cloud" class="w-4 h-4"></i> ${t('signInGoogle')}
                  </button>
                </div>`}
            </div>
          </div>
        `;
      },

      // =======================================================================
      // GLOBAL SEARCH, QUICK ADD, NOTIFICATIONS & MODAL HELPERS
      // =======================================================================
      handleGlobalSearch(query) {
        const box = document.getElementById('global-search-results');
        if (!box) return;
        const q = query.trim().toLowerCase();
        if (!q) {
          box.classList.add('hidden');
          return;
        }
        const results = [];
        (Store.data.tasks || []).forEach((tk) => {
          if (tk.title.toLowerCase().includes(q)) results.push({ type: t('tasks'), title: tk.title, view: 'tasks' });
        });
        (Store.data.notes || []).forEach((n) => {
          if (n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)) results.push({ type: t('navNotes'), title: n.title, view: 'notes' });
        });
        (Store.data.goals || []).forEach((g) => {
          if (g.title.toLowerCase().includes(q)) results.push({ type: t('goals'), title: g.title, view: 'goals' });
        });
        (Store.data.habits || []).forEach((h) => {
          if (h.name.toLowerCase().includes(q)) results.push({ type: t('habits'), title: h.name, view: 'habits' });
        });

        box.classList.remove('hidden');
        box.innerHTML = results.length
          ? results.slice(0, 8).map((r) => `
              <button onclick="App.navigate('${r.view}'); document.getElementById('global-search-results').classList.add('hidden')" class="w-full flex items-center justify-between p-2 rounded-lg hover:bg-white/10 text-left text-xs">
                <span class="font-medium truncate">${this.escapeHTML(r.title)}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 theme-primary-text">${r.type}</span>
              </button>`).join('')
          : `<div class="p-3 text-xs text-mutedGray text-center">No matching items found.</div>`;
      },

      openQuickAddModal() {
        this.openModal(`
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold">${t('quickAdd')}</h3>
            <button onclick="App.closeModal()" class="p-1.5 rounded-lg hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="grid grid-cols-2 gap-2.5 text-xs">
            <button onclick="App.openTaskModal()" class="p-3.5 rounded-xl bg-white/[0.04] hover:bg-white/10 border border-white/10 flex flex-col items-center gap-2 font-semibold">
              <i data-lucide="check-square" class="w-5 h-5 theme-primary-text"></i> ${t('newTask')}
            </button>
            <button onclick="App.openScheduleModal()" class="p-3.5 rounded-xl bg-white/[0.04] hover:bg-white/10 border border-white/10 flex flex-col items-center gap-2 font-semibold">
              <i data-lucide="clock" class="w-5 h-5 theme-accent-text"></i> ${t('timeBlock')}
            </button>
            <button onclick="App.openHabitModal()" class="p-3.5 rounded-xl bg-white/[0.04] hover:bg-white/10 border border-white/10 flex flex-col items-center gap-2 font-semibold">
              <i data-lucide="flame" class="w-5 h-5 text-orange-400"></i> ${t('newHabit')}
            </button>
            <button onclick="App.openNoteModal()" class="p-3.5 rounded-xl bg-white/[0.04] hover:bg-white/10 border border-white/10 flex flex-col items-center gap-2 font-semibold">
              <i data-lucide="file-text" class="w-5 h-5 text-amber-400"></i> ${t('newNote')}
            </button>
          </div>
        `);
      },

      toggleNotifications() {
        document.getElementById('notif-dropdown')?.classList.toggle('hidden');
        this.renderNotifications();
      },

      addNotification(text) {
        this.notifications.unshift({ id: 'n_' + Date.now(), text, read: false, time: new Date(Date.now() - 3600000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
        this.renderNotifications();
      },

      clearNotifications() {
        this.notifications.forEach((n) => (n.read = true));
        this.renderNotifications();
      },

      renderNotifications() {
        const unread = this.notifications.filter((n) => !n.read).length;
        const badge = document.getElementById('notif-badge');
        const list = document.getElementById('notif-list');
        if (badge) {
          badge.textContent = unread;
          badge.classList.toggle('hidden', unread === 0);
        }
        if (list) {
          list.innerHTML = this.notifications.map((n) => `
            <div class="p-2 rounded-lg ${n.read ? 'bg-white/[0.02] text-mutedGray' : 'theme-active-nav'}">
              <div>${this.escapeHTML(n.text)}</div>
              <div class="text-[10px] text-mutedGray mt-0.5">${n.time}</div>
            </div>`).join('');
        }
      },

      openModal(html) {
        const root = document.getElementById('modal-root');
        const card = document.getElementById('modal-card');
        if (!root || !card) return;
        card.innerHTML = html;
        root.classList.remove('hidden');
        root.classList.add('flex');
        if (window.lucide) lucide.createIcons();
      },

      closeModal() {
        const root = document.getElementById('modal-root');
        if (!root) return;
        root.classList.add('hidden');
        root.classList.remove('flex');
      },

      toast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        const colors = {
          success: 'border-emerald-500/40 bg-slateDark text-emerald-300',
          error: 'border-rose-500/40 bg-slateDark text-rose-300',
          info: 'border-white/15 bg-slateDark text-softWhite'
        };
        el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-2xl text-xs font-semibold flex items-center gap-2 animate-view ${colors[type] || colors.info}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      },

      priorityBadgeClass(p) {
        if (p === 'Urgent') return 'bg-rose-500/20 text-rose-300';
        if (p === 'High') return 'bg-amber-500/20 text-amber-300';
        if (p === 'Medium') return 'bg-blue-500/20 text-blue-300';
        return 'bg-white/10 text-mutedGray';
      },

      escapeHTML(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    };

    window.App = App;
    window.Store = Store;
    window.MusicEngine = MusicEngine;
    window.FocusEngine = FocusEngine;
    window.GPSEngine = GPSEngine;
    window.AIEngine = AIEngine;
    window.CloudSync = CloudSync;

    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
